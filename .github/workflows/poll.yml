name: Poll bike tracker

on:
  schedule:
    - cron: '0 */12 * * *'  # every 12 hours
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Poll API and update routes
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python3 poll.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rides.json
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update rides data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload rides.json to FTP
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl --silent --upload-file rides.json \
            --user ${{ secrets.ftp_username }}:${{ secrets.ftp_password }} \
            ftp://w008ef9a.kasserver.com/projects/gregoire-map/rides.json
